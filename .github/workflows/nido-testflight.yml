name: Nido TestFlight

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Rebuild current version or start the next major/minor version
        type: choice
        required: true
        default: rebuild
        options:
          - rebuild
          - major
          - minor

permissions:
  contents: write

concurrency:
  group: nido-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    env:
      BUNDLE_PATH: vendor/bundle
    defaults:
      run:
        working-directory: apps/nido
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version
        id: release
        shell: bash
        env:
          MODE: ${{ inputs.version_bump }}
        run: |
          metadata="$(./scripts/release-version.sh "$MODE")"
          printf '%s\n' "$metadata" >> "$GITHUB_OUTPUT"
          version="$(printf '%s\n' "$metadata" | sed -n 's/^version=//p')"
          echo "GARAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "GARAGE_BUILD_NUMBER=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Infisical CLI
        run: brew install infisical/get-cli/infisical

      - name: Prepare App Store signing
        shell: bash
        env:
          INFISICAL_TOKEN: ${{ secrets.GARAGE_INFISICAL_TOKEN }}
        run: >-
          infisical run --projectId=45def33c-abc5-482d-b0c0-812256633665
          --env=prod --path=/garage-ios-appstore
          --domain=https://infiscal.rockingsoft.com --silent
          -- ./scripts/prepare-release-signing.sh

      - name: Install Fastlane
        run: bundle install

      - name: Build and upload to TestFlight
        env:
          INFISICAL_TOKEN: ${{ secrets.GARAGE_INFISICAL_TOKEN }}
        run: >-
          infisical run --projectId=45def33c-abc5-482d-b0c0-812256633665
          --env=prod --path=/garage-ios-appstore
          --domain=https://infiscal.rockingsoft.com --silent
          -- bundle exec fastlane ios testflight

      - name: Record version after successful upload
        if: ${{ inputs.version_bump != 'rebuild' || steps.release.outputs.previous_tag == '' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="nido-v$RELEASE_VERSION"
          git tag "$tag"
          git push origin "refs/tags/$tag"
