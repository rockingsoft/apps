name: Garage TestFlight

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Rebuild current version or start the next major/minor version
        type: choice
        required: true
        default: rebuild
        options:
          - rebuild
          - major
          - minor

permissions:
  contents: write

concurrency:
  group: garage-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    env:
      BUNDLE_PATH: ${{ runner.temp }}/garage-bundle
    defaults:
      run:
        working-directory: apps/garage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version
        id: release
        shell: bash
        env:
          MODE: ${{ inputs.version_bump }}
        run: |
          metadata="$(./scripts/release-version.sh "$MODE")"
          printf '%s\n' "$metadata" >> "$GITHUB_OUTPUT"
          version="$(printf '%s\n' "$metadata" | sed -n 's/^version=//p')"
          echo "GARAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "GARAGE_BUILD_NUMBER=$(date +%s)" >> "$GITHUB_ENV"

      - name: Prepare App Store signing
        shell: bash
        env:
          GARAGE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.GARAGE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          GARAGE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.GARAGE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          GARAGE_APPSTORE_PROFILE_BASE64: ${{ secrets.GARAGE_APPSTORE_PROFILE_BASE64 }}
          GARAGE_KEYCHAIN_PASSWORD: ${{ secrets.GARAGE_KEYCHAIN_PASSWORD }}
        run: ./scripts/prepare-release-signing.sh

      - name: Install Fastlane
        run: bundle install

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.GARAGE_ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.GARAGE_ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.GARAGE_ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane ios testflight

      - name: Record version after successful upload
        if: ${{ inputs.version_bump != 'rebuild' || steps.release.outputs.previous_tag == '' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="garage-v$RELEASE_VERSION"
          git tag "$tag"
          git push origin "refs/tags/$tag"
