name: Release Paleta

on:
  push:
    tags:
      - "paleta-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/paleta
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#paleta-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/paleta.keychain-db"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"

      - name: Test and build signed app
        env:
          PALETA_VERSION: ${{ steps.version.outputs.value }}
          PALETA_BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_IDENTITY: "Developer ID Application: ROCKINGSOFT S.R.L. (3SRDN9365G)"
        run: |
          ./scripts/test.sh
          ./scripts/build.sh
          codesign --verify --deep --strict --verbose=2 build/Paleta.app

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          archive="$RUNNER_TEMP/Paleta.zip"
          ditto -c -k --keepParent build/Paleta.app "$archive"
          xcrun notarytool submit "$archive" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple build/Paleta.app
          xcrun stapler validate build/Paleta.app

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          artifact="Paleta-$VERSION.zip"
          ditto -c -k --keepParent build/Paleta.app "$artifact"
          shasum -a 256 "$artifact" > "$artifact.sha256"
          gh release create "$GITHUB_REF_NAME" "$artifact" "$artifact.sha256" --verify-tag --generate-notes --title "Paleta $VERSION"
